<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="14 days of IELTS Academic Reading vocabulary: 252 words + 24 phrases, flashcards, games and tests. Interface in Azerbaijani, Uzbek, English, Russian and Turkish.">
<meta name="theme-color" content="#FFF5E8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='%23FF7A5C' stroke='%23231B38' stroke-width='5'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='900' font-size='26' text-anchor='middle' fill='%23231B38'%3E14%3C/text%3E%3C/svg%3E">
</head>
<body>
<title>IELTS Söz 14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF5E8;--surface:#FFFFFF;--soft:#F5E9D8;--ink:#231B38;--ink-2:#6E6585;--line:#231B38;--shadow:#231B38;--on:#231B38;
  --coral:#FF7A5C;--sun:#FFC83D;--mint:#3DD6A8;--sky:#5AAEFF;--grape:#B49AFF;--pink:#FF8CC0;
  --ok:#3DD6A8;--bad:#FF6B6B;--ok-bg:#DDF8EE;--bad-bg:#FFE4E1;--ok-ink:#10805B;--bad-ink:#C8303E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15121E;--surface:#231E31;--soft:#2E2842;--ink:#F5F0FF;--ink-2:#ACA4C4;--line:#06050A;--shadow:#06050A;
  --ok-bg:#173A2F;--bad-bg:#3D1F25;--ok-ink:#7FF0C8;--bad-ink:#FF9AA4;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15121E;--surface:#231E31;--soft:#2E2842;--ink:#F5F0FF;--ink-2:#ACA4C4;--line:#06050A;--shadow:#06050A;
  --ok-bg:#173A2F;--bad-bg:#3D1F25;--ok-ink:#7FF0C8;--bad-ink:#FF9AA4;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
/* html clips sideways overflow (a card flying off-screen must not widen the page on iOS);
   body uses clip so it never becomes its own scroll container (keeps sticky headers working).
   overscroll-behavior-x stops Chrome's swipe-to-go-back/forward on horizontal overscroll. */
html{overflow-x:hidden;overscroll-behavior-x:none}
html.sess{overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;min-height:100vh;overflow-x:clip;overscroll-behavior-x:none;
  padding:0 max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
body.bare{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:540px;margin:0 auto}
h1,h2,h3{font-family:Unbounded,Rubik,sans-serif;letter-spacing:-.01em;margin:0}
h2{font-size:26px;line-height:1.15;margin:14px 0 6px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.sub{color:var(--ink-2);margin:0 0 16px;font-size:15px}
.sh{font:700 12.5px Unbounded;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);margin:28px 0 10px}

/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px Unbounded,sans-serif;background:var(--ink);color:var(--bg);
  border:2.5px solid var(--line);border-radius:16px;padding:14px 20px;min-height:54px;box-shadow:0 4px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.c{background:var(--c);color:var(--on)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.wide{width:100%}
.say{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 8px;
  font:600 12px Rubik;box-shadow:0 2px 0 var(--shadow);vertical-align:middle;line-height:1}
.say.big{padding:10px 14px;border-radius:14px}
.say.ping{animation:pop .45s}
.lb{flex:none;display:inline-grid;place-items:center;min-width:36px;height:24px;padding:0 6px;border-radius:8px;background:var(--c);color:var(--on);border:2px solid var(--line);font:700 11px Unbounded}
mark{background:var(--sun);color:var(--on);border-radius:5px;padding:0 3px;font-style:normal;font-weight:600}
.ipa{color:var(--ink-2);font-size:15px}

/* top bar + hero */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px}
.brand{font:800 14px Unbounded;display:flex;align-items:center;gap:9px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--coral);border:2.5px solid var(--line);display:grid;place-items:center;font:800 12px Unbounded;font-style:normal;color:var(--on);transform:rotate(-7deg);box-shadow:0 2px 0 var(--shadow)}
.lpill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:700 11.5px Unbounded;box-shadow:0 2px 0 var(--shadow)}
.hero{background:var(--c);color:var(--on);border:2.5px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--shadow);padding:18px 18px 16px;margin:12px 0 22px;position:relative;overflow:hidden;animation:rise .45s both}
.hero::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.22);right:-60px;top:-70px}
.hero::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18);left:44%;bottom:-50px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.streak{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.6);border:2px solid var(--line);border-radius:999px;padding:3px 10px;font:600 12.5px Rubik}
.daynum{font:800 68px/.95 Unbounded;margin-top:10px}
.daynum small{font:700 13px Unbounded;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.daynum em{font-style:normal;font-size:20px;opacity:.6}
.hero p{margin:12px 0 0;font-size:14.5px;position:relative;z-index:1}
.ring{flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:rgba(255,255,255,.55)}
.ring .fgc{stroke:var(--on);stroke-linecap:round;animation:ringin 1s .2s cubic-bezier(.3,1,.4,1) both}
.ring text{font:800 17px Unbounded;fill:var(--on)}

/* today steps */
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2.5px solid var(--line);
  border-radius:22px;padding:12px 14px 12px 12px;box-shadow:0 4px 0 var(--shadow);width:100%;animation:rise .45s both;transition:transform .08s,box-shadow .08s}
.step:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.step .ic{width:54px;height:54px;border-radius:17px;background:var(--c);border:2.5px solid var(--line);display:grid;place-items:center;color:var(--on)}
.step b{font:700 15.5px/1.25 Unbounded;display:block}
.step small{color:var(--ink-2);font-size:13.5px;display:block;line-height:1.35;margin-top:2px}
.step .go{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:2px solid var(--line)}
.step.done .go{background:var(--ok);color:var(--on)}
.step .mk{font:800 13px Unbounded;background:var(--ok);color:var(--on);border:2px solid var(--line);border-radius:999px;padding:6px 9px}
.step.off{opacity:.7}
.chips-x{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips-x::-webkit-scrollbar{display:none}
.wchip{scroll-snap-align:start;flex:none;background:var(--c);color:var(--on);border:2px solid var(--line);border-radius:16px;padding:9px 13px;box-shadow:0 3px 0 var(--shadow);text-align:left;min-width:118px;max-width:200px;animation:rise .4s both}
.wchip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.wchip b{display:block;font-weight:700;font-size:15.5px}
.wchip span{font-size:12.5px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{background:var(--surface);border:2.5px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 5px 0 var(--shadow);text-align:center;animation:rise .4s both}
.note h2{margin-top:6px}
.note .acts{display:grid;gap:10px;margin-top:16px}
.linkb{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:10px 0;font-size:14.5px}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2.5px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10.5px Rubik;color:var(--ink-2);padding:3px 0;min-width:0}
.bnav .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bnav .bi{width:48px;height:32px;border-radius:999px;display:grid;place-items:center;border:2px solid transparent}
.bnav button[aria-current=page]{color:var(--ink)}
.bnav button[aria-current=page] .bi{background:var(--c);color:var(--on);border-color:var(--line);animation:pop .35s}
body.bare .bnav{display:none}
@media (min-width:700px){.bnav{left:50%;right:auto;transform:translateX(-50%);width:540px;border:2.5px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}}

/* onboarding */
.onb{padding-top:26px;min-height:calc(100vh - 60px)}
.dots-step{display:flex;gap:6px;margin-bottom:18px}
.dots-step i{width:28px;height:9px;border-radius:99px;background:var(--soft);border:2px solid var(--line)}
.dots-step i.on{background:var(--coral)}
.cycle{font:800 clamp(26px,8vw,36px)/1.15 Unbounded;min-height:2.5em}
.cycle span{display:inline-block;animation:fadeword 1.7s both}
.ltiles{display:grid;gap:12px;margin-top:8px}
.ltile{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--c);color:var(--on);border:2.5px solid var(--line);border-radius:22px;
  padding:15px 18px;box-shadow:0 5px 0 var(--shadow);text-align:left;animation:rise .5s both;transition:transform .08s,box-shadow .08s}
.ltile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.ltile b{font:800 19px Unbounded;display:block}
.ltile small{font-size:14px;opacity:.85}
.ltile .code{font:800 28px Unbounded;opacity:.35}
.ltile.chosen{animation:chosen .45s both}
.onb-acts{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:22px}

/* combo builder */
.cb-card{background:var(--surface);border:2.5px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--shadow);padding:16px;position:relative;transition:outline-color .2s}
.cb-card.hot{outline:3px dashed var(--sky);outline-offset:5px}
.cb-word{font:800 26px Unbounded;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cb-en{display:flex;gap:10px;align-items:center;padding:8px 0 12px;border-bottom:2px dashed var(--soft);font-size:14px}
.cb-en .lock{margin-left:auto;font:600 11px Rubik;color:var(--ink-2);white-space:nowrap}
.cb-slots{position:relative;transition:height .25s;margin-top:10px}
.cb-row{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-left:7px solid var(--c);
  border-radius:14px;padding:0 7px 0 6px;transition:transform .28s cubic-bezier(.3,1.25,.5,1),opacity .2s;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.cb-row.drag{transition:opacity .2s;z-index:5;box-shadow:0 12px 22px rgba(0,0,0,.2);cursor:grabbing}
.cb-row.out{opacity:.4}
.cb-row.new{animation:rowin .45s}
.cb-row .grip{color:var(--ink-2);font-size:17px;letter-spacing:-4px;padding:0 6px 0 2px}
.cb-row .mt{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-row .x{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;flex:none}
.cb-empty{padding:12px 2px 2px;color:var(--ink-2);font-size:14px;margin:0}
.cb-tl{font:700 11.5px Unbounded;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:18px 0 8px}
.cb-tray{display:flex;flex-wrap:wrap;gap:10px;min-height:66px;padding:12px;border:2.5px dashed var(--ink-2);border-radius:20px;transition:background .2s}
.cb-tray.hot{background:var(--bad-bg)}
.cb-chip{display:flex;align-items:center;gap:8px;background:var(--c);color:var(--on);border:2.5px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 var(--shadow);
  font:700 14px Unbounded;touch-action:none;user-select:none;-webkit-user-select:none;animation:pop .3s}
.cb-chip small{font:500 12.5px Rubik}
.cb-ghost{position:fixed;z-index:60;pointer-events:none;animation:none !important;transform:translate(-50%,-50%) rotate(-5deg) scale(1.08);box-shadow:0 12px 22px rgba(0,0,0,.25)}
.cb-full{color:var(--ink-2);font-size:14px;align-self:center}
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg.wrapit{flex-wrap:wrap;overflow:visible}
.pchip{flex:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 13.5px Rubik;box-shadow:0 2px 0 var(--shadow);white-space:nowrap}
.pchip[aria-pressed=true]{background:var(--ink);color:var(--bg)}

/* path */
.path{display:grid;gap:12px;padding:6px 0 4px}
.node{display:flex;align-items:center;gap:14px;margin-left:var(--x);background:none;border:0;text-align:left;padding:0;width:max-content;max-width:calc(100% - var(--x));animation:rise .4s both}
.node:disabled{cursor:default}
.dot{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:800 21px Unbounded;background:var(--surface);border:3px solid var(--line);box-shadow:0 5px 0 var(--shadow);flex:none;color:var(--ink)}
.node.test .dot{border-radius:20px}
.node.done .dot{background:var(--c);color:var(--on)}
.node.cur .dot{background:var(--c);color:var(--on);animation:bob 1.5s ease-in-out infinite}
.node.lock .dot{background:var(--soft);color:var(--ink-2);box-shadow:0 3px 0 var(--shadow)}
.nlab b{display:block;font:700 13.5px/1.3 Unbounded}
.nlab small{color:var(--ink-2);font-size:12.5px}
.tag{display:inline-block;background:var(--ink);color:var(--bg);font:700 9.5px Unbounded;padding:3px 8px;border-radius:999px;text-transform:uppercase;vertical-align:2px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:160px;background:var(--surface);border:2.5px solid var(--line);border-radius:20px;padding:14px 12px 8px;box-shadow:0 4px 0 var(--shadow)}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.bar i{width:100%;background:var(--c);border:2px solid var(--line);border-radius:9px 9px 4px 4px;min-height:6px;transform-origin:bottom;animation:grow .7s cubic-bezier(.3,1.3,.5,1) both}
.bar b{font:700 12px Unbounded}
.bar small{font-size:11px;color:var(--ink-2)}

/* games */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gt{background:var(--c);color:var(--on);border:2.5px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--shadow);padding:14px;text-align:left;min-height:156px;
  display:flex;flex-direction:column;gap:7px;animation:rise .4s both;transition:transform .08s,box-shadow .08s}
.gt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.gt .gi{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.62);border:2px solid var(--line);display:grid;place-items:center}
.gt b{font:700 14.5px/1.2 Unbounded}
.gt small{font-size:12.5px;line-height:1.35;opacity:.88}

/* words */
.search{width:100%;font:500 16px Rubik;padding:14px 16px;border:2.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--shadow);margin-bottom:12px}
.daysel{font:600 14px Rubik;padding:8px 12px;border:2px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--shadow)}
.count{font:700 11.5px Unbounded;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 10px}
.wrow{background:var(--surface);border:2px solid var(--line);border-left:8px solid var(--c);border-radius:16px;margin-bottom:9px;overflow:hidden;display:grid;grid-template-columns:1fr auto;align-items:start}
.wbtn{display:grid;grid-template-columns:1fr auto;gap:1px 10px;width:100%;background:none;border:0;text-align:left;padding:10px 4px 10px 12px;min-width:0}
.wbtn b{font-weight:700;font-size:17px}
.wbtn .ipa{font-size:13px}
.wbtn .m{grid-column:1/-1;color:var(--ink-2);font-size:14.5px}
.wrow .say{margin:12px 10px 0 0}
.wdet{grid-column:1/-1;padding:0 12px 12px;animation:rise .25s both;font-size:15px}
.wdet p{margin:6px 0}
.bx{display:inline-flex;gap:3px;align-items:center}
.bx i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line);background:var(--soft)}
.bx i.f{background:var(--mint)}
.bx .nw{font:700 9.5px Unbounded;text-transform:uppercase;color:var(--ink-2)}

/* settings */
.how{padding-left:20px;margin:0;color:var(--ink-2);font-size:14.5px}
.how li{margin-bottom:9px}
.sync{font:600 12.5px Rubik;color:var(--ink-2);margin-top:18px}

/* session */
.stop{display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  margin:0 calc(-1 * max(16px,env(safe-area-inset-right))) 0 calc(-1 * max(16px,env(safe-area-inset-left)));position:sticky;top:0;background:var(--bg);z-index:5}
@media (min-width:572px){.stop{margin:0;padding-left:0;padding-right:0}}
.xbtn{width:42px;height:42px;border-radius:13px;border:2.5px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 0 var(--shadow);flex:none}
.pbar{flex:1;height:18px;border-radius:999px;background:var(--soft);border:2.5px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .4s cubic-bezier(.3,1.1,.4,1)}
.pcount{font:700 12.5px Unbounded;min-width:44px;text-align:right}
.stitle{font:700 12.5px Unbounded;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 14px}

/* flash card */
.deck{position:relative;touch-action:pan-y;height:clamp(340px,calc(100vh - 300px),540px);height:clamp(340px,calc(100svh - 300px),540px)}
.swipe{position:absolute;inset:0;touch-action:pan-y;transition:transform .25s,opacity .25s}
.swipe.dragging{transition:none}
.flip{position:absolute;inset:0;perspective:1400px}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2.5px solid var(--line);border-radius:28px;box-shadow:0 6px 0 var(--shadow);overflow:auto;padding:22px 20px}
.front{background:var(--c);color:var(--on);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer}
.front .ipa{color:var(--on);opacity:.75}
.back{background:var(--surface);transform:rotateY(180deg)}
.fw{font:800 clamp(30px,9.5vw,46px)/1.1 Unbounded;word-break:break-word}
.fw.sm{font-size:clamp(22px,6.5vw,30px)}
.pos{display:inline-block;font:700 10.5px Unbounded;letter-spacing:.06em;text-transform:uppercase;border:2px solid currentColor;border-radius:999px;padding:3px 9px}
.hintq{margin:14px 0 0;font:600 14px Rubik;opacity:.8}
.oth{font-size:14px;opacity:.8}
.stamp{position:absolute;top:26px;font:800 18px Unbounded;padding:6px 12px;border:3px solid;border-radius:12px;opacity:0;pointer-events:none;z-index:3;background:var(--surface)}
.st-no{right:20px;color:var(--bad-ink);transform:rotate(9deg)}
.st-ok{left:20px;color:var(--ok-ink);transform:rotate(-9deg)}
.bk-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.bk-head b{font:800 24px Unbounded}

.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:16px;padding:11px 14px;min-height:58px;

.opt.right{background:var(--ok);color:var(--on);animation:pop .4s both}

.opt.picked{background:var(--sun);color:var(--on);animation:pop .3s both}

.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(115%);transition:transform .34s cubic-bezier(.3,1.2,.5,1)}

  padding:16px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-shadow:0 -4px 0 var(--shadow);max-height:70vh;overflow:auto}

/* type / match / spot */

.tok{background:none;border:0;padding:1px 3px;border-radius:8px;font:inherit;line-height:inherit;color:inherit;transition:background .2s}

.mascot{flex:none;width:64px;height:64px;border-radius:46% 54% 50% 50%/52% 48% 52% 48%;background:var(--sun);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--shadow);position:relative;animation:wob 3.2s ease-in-out infinite;padding:0}

.mascot b{position:absolute;left:50%;bottom:14px;width:18px;height:9px;border:3px solid #231B38;border-top:0;border-radius:0 0 12px 12px;transform:translateX(-50%)}

.bubble{flex:1;min-width:0;background:var(--surface);border:2.5px solid var(--line);border-radius:20px 20px 20px 6px;padding:11px 14px;box-shadow:0 4px 0 var(--shadow)}

.goal .gb{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.55);border:2px solid var(--line);overflow:hidden}
.goal .gb i{display:block;height:100%;background:var(--on);border-radius:99px;transform-origin:left;animation:grow-x .9s .2s cubic-bezier(.3,1.2,.5,1) both}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:80;
  /* fully off-screen (shadow and safe area included) and invisible while idle */
  transform:translate(-50%,calc(-100% - 30px - env(safe-area-inset-top)));visibility:hidden;transition:transform .4s cubic-bezier(.3,1.3,.5,1),visibility 0s .4s;background:var(--c);color:var(--on);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--shadow);
  padding:10px 16px;font:700 14.5px Rubik;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);width:max-content}

/* profile + leaderboard */
.pcard{background:var(--c);color:var(--on);border:2.5px solid var(--line);border-radius:26px;box-shadow:0 6px 0 var(--shadow);padding:18px;margin:12px 0 0;position:relative;overflow:hidden;animation:rise .4s both}

.bigav{width:72px;height:72px;border-radius:50%;background:var(--surface);color:var(--ink);border:3px solid var(--line);display:grid;place-items:center;font:800 30px Unbounded;flex:none}
.pname{font:800 22px/1.15 Unbounded;word-break:break-word}
.plvl{font:600 14px Rubik;margin-top:2px}
.xbar{height:16px;border-radius:99px;background:rgba(255,255,255,.55);border:2.5px solid var(--line);overflow:hidden;margin:14px 0 4px;position:relative;z-index:1}

.pedit{position:relative;z-index:1;background:rgba(255,255,255,.6);border:2px solid var(--line);border-radius:999px;padding:5px 11px;font:600 12.5px Rubik;color:var(--on);margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:var(--surface);border:2.5px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--shadow);animation:rise .4s both;border-top:8px solid var(--c)}
.stat b{display:block;font:800 24px Unbounded}

.lrow{display:grid;grid-template-columns:22px 38px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin-bottom:8px;animation:rise .35s both}

.lrow .av{width:38px;height:38px;font-size:14px;box-shadow:none}
.lrow b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  fb.innerHTML = `<div class="fb-in ${ok ? "ok" : "bad"}"><div class="fb-h">${svg(ok ? "check" : "x", 24, 3)} ${ok ? pick([t("ok1"), t("ok2"), t("ok3")]) : t("bad")}</div>${html}<button type="button" class="btn wide c" style="--c:${ok ? "var(--ok)" : "var(--bad)"}" id="nx">${last ? t("results") : t("next")} →</button></div>`;
  requestAnimationFrame(() => fb.classList.add("show"));
  $("#nx").onclick = () => { closeFb(); onNext(); };
  buzz(ok ? 12 : [30, 40, 30]);
}
function closeFb() { const fb = $("#fb"); if (fb) fb.classList.remove("show"); }
function exitSession() { clearInterval(activeTimer); closeFb(); view = backTo; render(); window.scrollTo(0, 0); }
// Leave through history when the session pushed an entry, so back/forward stay in sync.
function leaveSession() {
  if (history.state && history.state.s) { try { history.back(); return; } catch (e) {} }
  exitSession();
}
addEventListener("popstate", () => { if (view === "session") exitSession(); });
function endScreen(stage, o) {

  if (!o.banner && S.name && o.big !== "0") o.banner = t(o.pct == null || o.pct >= .7 ? "praise_hi" : "praise_lo", { name: S.name });
  stage.innerHTML = `<div class="end">${o.banner ? `<div class="banner">${esc(o.banner)}</div>` : ""}${sessXP ? `<div style="margin:2px 0 6px"><span class="xpc pop">+${sessXP} XP</span></div>` : ""}<div class="blob" style="--c:${o.color || "var(--mint)"}"><span class="big">${esc(o.big)}</span>${o.small ? `<small>${esc(o.small)}</small>` : ""}</div>${o.text ? `<p>${esc(o.text)}</p>` : ""}${o.extra || ""}<div class="acts">${o.again ? `<button type="button" class="btn ghost wide" id="ag">${t("p_again")}</button>` : ""}<button type="button" class="btn wide" id="hm">${backTo === "today" ? t("b_today") : t("b_games")}</button></div></div>`;

}
function gameDone() {
  let n = selDay || curDay();
  if (!selDay && n > 1 && !started(n) && S.days[n - 1] && S.days[n - 1].at === todayIdx()) n = n - 1;
  day(n).game = true; const fin = checkDone(n); persist(); return fin ? n : 0;
}
const resMsg = p => p >= .9 ? t("res90") : p >= .7 ? t("res70") : p >= .5 ? t("res50") : t("res0");
const weakListHTML = items => items.length ? `<p class="sh" style="text-align:left">${t("look")}</p><div class="wlist">${[...new Set(items)].map(it => `<div><b lang="en">${esc(it.w)}</b>${sayBtn(it.w)}<span>${esc(primary(it))}</span></div>`).join("")}</div>` : "";

/* ---------- flashcards with flip + swipe ---------- */
function runCards(ids, mode, n, reverse) {
  let q = mode === "learn" ? ids.slice() : shuffle(ids);
  const total = q.length; let done = 0, first = 0; const missed = new Set();
  const title = mode === "learn" ? t("st_new") : mode === "review" ? t("st_review") : reverse ? t("g_rcards") : t("g_cards");
  const color = mode === "review" ? "var(--sky)" : reverse ? "var(--pink)" : "var(--coral)";
  shell(title, color, (stage, prog) => {
    if (!total) return endScreen(stage, { big: "0", text: t("few") });
    const show = () => {
      if (!q.length) return finish();
      const it = BYID[q[0]]; let flipped = false, busy = false;
      prog(done, total);
      const fc = col(it.day + (missed.has(it.id) ? 2 : 0) + done);
      const front = reverse
        ? `<span class="pos">${t("pos_" + it.pos)}</span><div class="fw sm">${esc(primary(it))}</div>${S.langs.length > 1 ? `<div class="oth">${S.langs.slice(1).map(l => esc(it.m[l])).join(" · ")}</div>` : ""}${it.def && S.langs.length ? `<div class="oth" lang="en">${esc(it.def)}</div>` : ""}<p class="hintq">${t("recall_w")}</p>`
        : `<span class="pos">${t("pos_" + it.pos)}</span><div class="fw" lang="en">${esc(it.w)}</div><div class="ipa">/${esc(it.ipa)}/</div>${sayBtn(it.w, "", true)}<p class="hintq">${t("recall_m")}</p>`;
      const back = `<div class="bk-head"><b lang="en">${esc(it.w)}</b>${sayBtn(it.w)}<span class="ipa">/${esc(it.ipa)}/</span></div>${detailHTML(it)}`;
      const L = [[t("r0"), "var(--bad)"], [t("r1"), "var(--sun)"], [t("r2"), "var(--mint)"], [t("r3"), "var(--sky)"]];
      stage.innerHTML = `<div class="deck"><div class="swipe" id="sw"><div class="flip" id="fl"><div class="flip-in"><div class="face front" style="--c:${fc}">${front}</div><div class="face back">${back}</div></div></div><div class="stamp st-no" id="sn">${t("r0")}</div><div class="stamp st-ok" id="so">${t("r2")}</div></div></div>
        <p class="hint" id="hint">${t("tap_flip")}</p><div class="rate" id="rate" hidden>${L.map(([l, c], k) => `<button type="button" data-q="${k}" style="--c:${c}"><b>${l}</b><small>${nextLabel(it.id, k)}</small></button>`).join("")}</div>`;
      const sw = $("#sw"), fl = $("#fl"), sn = $("#sn"), so = $("#so");
      if (!reverse && mode !== "review" && !missed.has(it.id)) say(it.w);
      const flip = () => {
        if (flipped) return; flipped = true; fl.classList.add("on"); buzz(8);
        $("#rate").hidden = false; $("#hint").textContent = t("swipe");
        if (reverse) say(it.w);
      };
      const choose = r => {
        rate(it.id, r); q.shift();
        if (r === 0) { missed.add(it.id); q.splice(Math.min(3, q.length), 0, it.id); }
        else { done++; if (!missed.has(it.id)) first++; }
        show();
      };
      const fly = r => {
        if (busy) return; busy = true; buzz(r === 0 ? 20 : 10);
        const dir = r === 0 ? -1 : r === 1 ? 0 : 1;
        sw.classList.remove("dragging");
        sw.style.transform = dir ? `translateX(${dir * 130}%) rotate(${dir * 16}deg)` : "translateY(70px) scale(.9)";
        sw.style.opacity = "0";
        setTimeout(() => choose(r), RM ? 0 : 240);
      };
      $$("#rate button").forEach(b => b.onclick = () => fly(+b.dataset.q));
      let sx = 0, sy = 0, dx = 0, active = false, drag = false, suppress = false;
      sw.addEventListener("pointerdown", e => { if (!flipped || busy) return; active = true; drag = false; sx = e.clientX; sy = e.clientY; dx = 0; });
      sw.addEventListener("pointermove", e => {
        if (!active) return;
        const mx = e.clientX - sx, my = e.clientY - sy;
        if (!drag) {
          if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)) { drag = true; try { sw.setPointerCapture(e.pointerId); } catch (er) {} sw.classList.add("dragging"); }
          else if (Math.abs(my) > 12) active = false;
          return;
        }
        dx = mx;
        sw.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
        sn.style.opacity = Math.min(1, Math.max(0, -dx / 90)); so.style.opacity = Math.min(1, Math.max(0, dx / 90));
      });
      const end = () => {
        if (!active) return; active = false;
        if (drag) { suppress = true; if (Math.abs(dx) > 90) fly(dx > 0 ? 2 : 0); else { sw.classList.remove("dragging"); sw.style.transform = ""; sn.style.opacity = so.style.opacity = 0; } }
      };
      sw.addEventListener("pointerup", end); sw.addEventListener("pointercancel", end);
      sw.addEventListener("click", () => { if (suppress) { suppress = false; return; } flip(); });
      keyHandler = e => {
        if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
        else if (flipped && "1234".includes(e.key)) { e.preventDefault(); fly(+e.key - 1); }
        else if (flipped && e.key === "ArrowLeft") fly(0);
        else if (flipped && e.key === "ArrowRight") fly(2);
      };
    };
    const finish = () => {
      let banner = "";
      if (mode === "learn") { day(n).learn = true; if (checkDone(n)) banner = t("day_done", { n }); }
      else if (mode === "review") day(n).review = true;
      else { const f = gameDone(); if (f) banner = t("day_done", { n: f }); }
      persist();
      endScreen(stage, { big: String(total), small: t("cards_n"), color, banner, celebrate: true,
        text: mode === "learn" ? t("learn_r", { f: first }) : t("review_r", { f: first }),
        again: mode === "free" ? () => runCards(ids, mode, n, reverse) : null });
    };
    show();
  });
}

/* ---------- multiple choice ---------- */
function runMCQ(title, color, qs, opt = {}) {
  let i = 0, score = 0; const res = [];
  shell(title, color, (stage, prog) => {
    if (!qs.length) return endScreen(stage, { big: "0", text: t("few") });
    const show = () => {
      if (i >= qs.length) return finish();
      prog(i, qs.length);
      const q = qs[i]; let done = false;
      stage.innerHTML = `<div class="qa">${q.prompt}<div class="opts">${q.options.map((o, k) => `<button type="button" class="opt" data-k="${k}" style="animation-delay:${k * 50}ms;--c:${col(k)}"><span class="k">${"ABCD"[k]}</span><span lang="${q.optLang}">${esc(o.label)}</span></button>`).join("")}</div></div>`;
      const btns = $$(".opt", stage);
      const next = () => { i++; show(); };
      const pickK = k => {
        if (done) return; done = true;
        const ok = q.options[k].correct; if (ok) score++;
        res.push({ q, k, ok }); mark(q.item.id, ok);
        btns.forEach(b => b.disabled = true);
        if (opt.test) { btns[k].classList.add("picked"); buzz(8); setTimeout(next, 330); return; }
        btns.forEach((b, j) => { if (q.options[j].correct) b.classList.add("right"); else if (j === k) b.classList.add("wrong"); });
        if (ok) burstAt(btns[k], 16);
        showFb(ok, (ok ? "" : `<p>${t("bad_s")}</p>`) + afterHTML(q.item), i + 1 >= qs.length, next);
      };
      btns.forEach((b, k) => b.onclick = () => pickK(k));
      keyHandler = e => {
        const m = "1234abcd".indexOf(e.key.toLowerCase());
        if (!done && m >= 0 && m % 4 < btns.length) { e.preventDefault(); pickK(m % 4); }
        else if (done && !opt.test && e.key === "Enter") { e.preventDefault(); closeFb(); next(); }
      };
    };
    const finish = () => {
      let banner = "";
      if (opt.onEnd) { if (opt.onEnd(score, qs.length)) banner = t("day_done", { n: opt.n }); }
      else { const f = gameDone(); if (f) banner = t("day_done", { n: f }); }
      persist();
      const pct = score / qs.length, wrong = res.filter(r => !r.ok).map(r => r.q.item);
      let extra = "";
      if (opt.test) extra = `<div class="rlist">${res.map((r, j) => `<div class="rrow" style="animation-delay:${j * 30}ms"><span class="n">${j + 1}</span><span><span class="q">${esc(r.q.short)}</span><span class="y">${esc(r.q.options[r.k].label)}</span>${r.ok ? "" : `<span class="r">✓ ${esc(r.q.options.find(o => o.correct).label)}</span>`}</span><span class="badge ${r.ok ? "ok" : "no"}">${svg(r.ok ? "check" : "x", 16, 3)}</span></div>`).join("")}</div>`;
      else extra = weakListHTML(wrong);
      endScreen(stage, { big: `${score}/${qs.length}`, pct, color: pct >= .7 ? "var(--mint)" : pct >= .5 ? "var(--sun)" : "var(--coral)", banner,
        text: resMsg(pct), extra, celebrate: pct >= .7 || !!banner, again: opt.again });
    };
    show();
  });
}
function runTest(items, count, n, title) {
  const weak = items.filter(it => !S.cards[it.id] || isWeak(it)), rest = items.filter(it => !weak.includes(it));
  let pk = [...sample(weak, Math.ceil(count * .6)), ...sample(rest, count)].slice(0, count);
  if (pk.length < count) pk = [...pk, ...shuffle(items.filter(x => !pk.includes(x)))].slice(0, count);
  runMCQ(title, "var(--sun)", buildQs(pk, count, ["meaning", "cloze", "syn", "reverse"]), { test: true, n,
    onEnd: (s, tot) => { const d = day(n); d.test = s; d.testOf = tot; if (s === tot && tot >= 10) S.perfect = true; touch(); return checkDone(n); } });
}

/* ---------- type it ---------- */
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
function runType(items) {
  const qs = sample(items, Math.min(10, items.length)); let i = 0, score = 0;
  shell(t("g_type"), "var(--sky)", (stage, prog) => {
    if (!qs.length) return endScreen(stage, { big: "0", text: t("few") });
    const show = () => {
      if (i >= qs.length) { const f = gameDone(); return endScreen(stage, { big: `${score}/${qs.length}`, pct: score / qs.length, color: "var(--sky)", text: t("type_r"), celebrate: score / qs.length >= .7, banner: f ? t("day_done", { n: f }) : "", again: () => runType(items) }); }
      const it = qs[i]; let hint = 1, tries = 0, done = false;
      prog(i, qs.length);
      const slots = () => it.w.split("").map((c, j) => c === " " ? '<i class="sp"></i>' : j < hint ? `<i class="f">${esc(c)}</i>` : "<i></i>").join("");
      stage.innerHTML = `<div class="qa"><p class="qh">${t("recall_w")}</p>${S.langs.length ? `<p class="qmean">${esc(primary(it))}</p>${S.langs.length > 1 ? `<p class="ipa" style="margin:0">${S.langs.slice(1).map(l => esc(it.m[l])).join(" · ")}</p>` : ""}` : ""}
        <p class="ipa" lang="en" style="margin:6px 0 0">${esc(enDef(it))}</p>
        <div class="slots" id="sl" lang="en">${slots()}</div><p class="ipa" style="margin:0">${t("letters", { n: it.w.replace(/ /g, "").length })}</p>
        <input class="tin" id="ti" lang="en" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="English">
        <p class="msg" id="msg"></p>
        <div class="tacts"><button type="button" class="btn c" style="--c:var(--mint)" id="ck">${t("check")}</button><button type="button" class="btn ghost" id="hn">${t("hint")}</button><button type="button" class="btn ghost" id="gv">${t("dunno")}</button></div></div>`;
      const ti = $("#ti"), msg = $("#msg");
      setTimeout(() => ti.focus({ preventScroll: true }), 50);
      const next = () => { i++; show(); };
      const reveal = ok => {
        done = true; ti.disabled = true; ti.blur(); if (!ok) ti.value = it.w;
        mark(it.id, ok); if (ok) { score++; burstAt(ti, 18); }
        say(it.w);
        showFb(ok, (ok ? "" : `<p>${t("type_bad")}</p>`) + afterHTML(it), i + 1 >= qs.length, next);
      };
      const check = () => {
        if (done) return;
        const v = norm(ti.value); if (!v) return;
        if (v === norm(it.w)) return reveal(true);
        tries++;
        if (tries < 2 && lev(v, norm(it.w)) <= 2) { msg.textContent = t("almost"); ti.classList.remove("shake"); void ti.offsetWidth; ti.classList.add("shake"); buzz(25); ti.select(); return; }
        reveal(false);
      };
      $("#ck").onclick = check;
      $("#hn").onclick = () => { if (hint < it.w.length - 1) { hint++; $("#sl").innerHTML = slots(); } ti.focus(); };
      $("#gv").onclick = () => { if (!done) reveal(false); };
      ti.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
      keyHandler = e => { if (done && e.key === "Enter") { e.preventDefault(); closeFb(); next(); } };
    };
    show();
  });
}

/* ---------- pairs ---------- */
function runMatch(items) {
  const pool = [], seen = new Set();
  for (const it of shuffle(items)) { const L = norm(primary(it)); if (seen.has(L)) continue; seen.add(L); pool.push(it); if (pool.length >= 12) break; }
  const rounds = [];
  for (let k = 0; k < pool.length; k += 6) rounds.push(pool.slice(k, k + 6));
  if (rounds.length > 1 && rounds[rounds.length - 1].length < 3) rounds[rounds.length - 2].push(...rounds.pop());
  let r = 0, miss = 0, matched = 0; const t0 = Date.now();
  shell(t("g_match"), "var(--grape)", (stage, prog) => {
    if (pool.length < 3) return endScreen(stage, { big: "0", text: t("few") });
    const tick = () => { prog(matched, pool.length); $("#pc").textContent = t("secs", { n: Math.round((Date.now() - t0) / 1000) }); };
    tick(); activeTimer = setInterval(tick, 1000);
    const show = () => {
      const R = rounds[r]; let sel = null, left = R.length;
      stage.innerHTML = `<p class="qh">${t("match_h")}</p><div class="mgrid"><div class="mcol">${shuffle(R).map((x, k) => `<button type="button" class="mt2" data-id="${x.id}" data-s="L" lang="en" style="animation-delay:${k * 40}ms">${esc(x.w)}</button>`).join("")}</div><div class="mcol">${shuffle(R).map((x, k) => `<button type="button" class="mt2" data-id="${x.id}" data-s="R" lang="${S.langs[0] || "en"}" style="animation-delay:${k * 40 + 20}ms">${esc(primary(x))}</button>`).join("")}</div></div>`;
      $$(".mt2", stage).forEach(b => b.onclick = () => {
        if (b.disabled) return;
        if (!sel || sel.dataset.s === b.dataset.s) { if (sel) sel.classList.remove("sel"); sel = b; b.classList.add("sel"); buzz(6); return; }
        if (sel.dataset.id === b.dataset.id) {
          const pc = col(matched);
          [sel, b].forEach(x => { x.classList.remove("sel"); x.style.setProperty("--pc", pc); x.classList.add("done"); x.disabled = true; });
          burstAt(b, 10); say(BYID[b.dataset.id].w); buzz(12);
          sel = null; matched++; tick();
          if (--left === 0) { r++; if (r < rounds.length) setTimeout(show, 420); else setTimeout(finish, 350); }
        } else {
          miss++; buzz([25, 30, 25]);
          const a = sel, c = b; mark(a.dataset.s === "L" ? a.dataset.id : c.dataset.id, false);
          [a, c].forEach(x => { x.classList.remove("sel"); x.classList.add("no"); });
          setTimeout(() => [a, c].forEach(x => x.classList.remove("no")), 420);
          sel = null;
        }
      });
    };
    const finish = () => {
      const secs = Math.round((Date.now() - t0) / 1000);
      if (secs < 30 && pool.length >= 6) S.fast = true;
      const f = gameDone();
      endScreen(stage, { big: String(secs), small: t("seconds"), color: "var(--grape)", celebrate: true, banner: f ? t("day_done", { n: f }) : "",
        text: t("match_r", { p: pool.length, m: miss }), again: () => runMatch(items) });
    };
    show();
  });
}

/* ---------- spot the synonym ---------- */
function runSpot(items) {
  const okItems = items.filter(x => x.syns.some(s => !x.ex.toLowerCase().includes(s.toLowerCase())));
  const qs = sample(okItems, Math.min(8, okItems.length)); let i = 0, score = 0;
  shell(t("g_spot"), "var(--pink)", (stage, prog) => {
    if (!qs.length) return endScreen(stage, { big: "0", text: t("few") });
    const show = () => {
      if (i >= qs.length) { const f = gameDone(); return endScreen(stage, { big: `${score}/${qs.length}`, pct: score / qs.length, color: "var(--pink)", text: t("spot_r"), celebrate: score / qs.length >= .7, banner: f ? t("day_done", { n: f }) : "", again: () => runSpot(items) }); }
      const it = qs[i]; let done = false;
      prog(i, qs.length);
      const syn = it.syns.find(s => !it.ex.toLowerCase().includes(s.toLowerCase()));
      const a = it.ex.indexOf(it.ans), b = a + it.ans.length;
      let pos = 0, html = "";
      it.ex.split(/(\s+)/).forEach(part => {
        if (!part) return;
        if (/^\s+$/.test(part)) { html += " "; pos += part.length; return; }
        const s = pos, e = pos + part.length; pos = e;
        html += `<button type="button" class="tok" data-hit="${s < b && e > a ? 1 : 0}">${esc(part)}</button>`;
      });
      stage.innerHTML = `<div class="qa"><p class="qh">${t("spot_q")}</p><span class="qsyn" lang="en">«${esc(syn)}»</span><p class="qh">${t("spot_tap")}</p><p class="spot" lang="en">${html}</p></div>`;
      const next = () => { i++; show(); };
      $$(".tok", stage).forEach(tk => tk.onclick = () => {
        if (done) return; done = true;
        const hit = tk.dataset.hit === "1"; if (hit) score++;
        mark(it.id, hit);
        $$(".tok", stage).forEach(x => { x.disabled = true; if (x.dataset.hit === "1") x.classList.add("hit"); });
        if (!hit) tk.classList.add("miss"); else burstAt(tk, 14);
        showFb(hit, `<p>${hit ? t("spot_ok") : t("spot_bad")}</p><p><b lang="en">${esc(it.w)}</b> ${sayBtn(it.w)} ≈ <span lang="en">${esc(it.syns.join(", "))}</span></p><p>${esc(primary(it))}</p>`, i + 1 >= qs.length, next);
      });
      keyHandler = e => { if (done && e.key === "Enter") { e.preventDefault(); closeFb(); next(); } };
    };
    show();
  });
}

/* ---------- games ---------- */
const GAMES = [
  { id: "cards", icon: "cards", c: "var(--coral)", run: items => runCards(items.map(x => x.id), "free", 0, false) },
  { id: "rcards", icon: "rcards", c: "var(--pink)", run: items => runCards(items.map(x => x.id), "free", 0, true) },
  { id: "mcq", icon: "mcq", c: "var(--sun)", run: items => { const f = () => runMCQ(t("g_mcq"), "var(--sun)", buildQs(items, 10, ["meaning", "reverse"]), { again: f }); f(); } },
  { id: "cloze", icon: "cloze", c: "var(--mint)", run: items => { const f = () => runMCQ(t("g_cloze"), "var(--mint)", buildQs(items, 10, ["cloze"]), { again: f }); f(); } },
  { id: "spot", icon: "spot", c: "var(--grape)", run: items => runSpot(items) },
  { id: "type", icon: "type", c: "var(--sky)", run: items => runType(items) },
  { id: "match", icon: "match", c: "var(--coral)", run: items => runMatch(items) },

function comboBuilder(root, onChange) {
  const H = 58;
  const it = ALL.find(x => x.w === "accelerate") || ALL[0];
  const commit = (L, freshL) => { S.langs = L; S.lset = true; persist(); draw(freshL); onChange && onChange(); };
  const draw = freshL => {
    const L = S.langs;
    root.innerHTML = `<div class="cb-card" id="cbc"><div class="cb-word" lang="en">${esc(it.w)} ${sayBtn(it.w)}</div>

      <div class="cb-slots" id="cbs" style="height:${L.length ? L.length * H - 8 : 0}px">${L.map((l, i) => `<div class="cb-row ${freshL === l ? "new" : ""}" data-l="${l}" style="transform:translateY(${i * H}px);--c:${LCOL[l]}"><span class="grip" aria-hidden="true">⋮⋮</span>${lb(l)}<span class="mt" lang="${l}">${esc(it.m[l])}</span><button type="button" class="x" data-x="${l}" aria-label="−${CODE[l]}">${svg("x", 15, 2.8)}</button></div>`).join("")}</div>
      ${L.length ? "" : `<p class="cb-empty">${t("ob_empty")}</p>`}</div>
      <p class="cb-tl">${t("ob_tray")}</p><div class="cb-tray" id="cbt">${MLANGS.filter(l => !L.includes(l)).map(l => `<button type="button" class="cb-chip" data-l="${l}" style="--c:${LCOL[l]}">${CODE[l]} <small>${NATIVE[l]}</small></button>`).join("") || '<span class="cb-full">✓</span>'}</div>
      <p class="cb-tl">${t("presets")}</p><div class="seg">${PRESETS.map((p, k) => `<button type="button" class="pchip" data-p="${k}" aria-pressed="${sameArr(L, p)}">${presetLabel(p)}</button>`).join("")}</div>`;
    const card = $("#cbc", root), slots = $("#cbs", root), tray = $("#cbt", root);
    $$("[data-x]", root).forEach(b => b.onclick = e => { e.stopPropagation(); buzz(10); commit(S.langs.filter(x => x !== b.dataset.x)); });
    $$("[data-p]", root).forEach(b => b.onclick = () => { buzz(8); commit(PRESETS[+b.dataset.p].slice()); });
    // drag rows to reorder, drag below the card to remove
    $$(".cb-row", root).forEach(row => row.addEventListener("pointerdown", e => {
      if (e.target.closest(".x,.say")) return;
      e.preventDefault();
      const l = row.dataset.l, ord = S.langs.slice(), i0 = ord.indexOf(l), y0 = e.clientY, rows = $$(".cb-row", root);
      let cur = i0, out = false;
      try { row.setPointerCapture(e.pointerId); } catch (er) {}
      row.classList.add("drag");
      const move = ev => {
        const dy = ev.clientY - y0;
        row.style.transform = `translateY(${i0 * H + dy}px) scale(1.03)`;
        const ni = Math.max(0, Math.min(ord.length - 1, Math.round((i0 * H + dy) / H)));
        if (ni !== cur) { ord.splice(cur, 1); ord.splice(ni, 0, l); cur = ni; rows.forEach(r => { if (r !== row) r.style.transform = `translateY(${ord.indexOf(r.dataset.l) * H}px)`; }); buzz(6); }
        out = ev.clientY > card.getBoundingClientRect().bottom + 12;
        row.classList.toggle("out", out); tray.classList.toggle("hot", out);
      };
      const up = () => {
        row.removeEventListener("pointermove", move); row.removeEventListener("pointerup", up); row.removeEventListener("pointercancel", up);
        tray.classList.remove("hot");
        commit(out ? ord.filter(x => x !== l) : ord);

      row.addEventListener("pointermove", move); row.addEventListener("pointerup", up); row.addEventListener("pointercancel", up);
    }));
    // tap or drag a tray chip onto the card
    $$(".cb-chip", root).forEach(ch => ch.addEventListener("pointerdown", e => {
      e.preventDefault();
      const l = ch.dataset.l, x0 = e.clientX, y0 = e.clientY; let ghost = null;
      try { ch.setPointerCapture(e.pointerId); } catch (er) {}
      const over = ev => { const r = card.getBoundingClientRect(); return ev.clientY > r.top - 24 && ev.clientY < r.bottom + 24; };
      const move = ev => {
        if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) > 6) { ghost = ch.cloneNode(true); ghost.classList.add("cb-ghost"); document.body.appendChild(ghost); ch.style.opacity = ".3"; }
        if (ghost) { ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px"; card.classList.toggle("hot", over(ev)); }
      };
      const up = ev => {
        ch.removeEventListener("pointermove", move); ch.removeEventListener("pointerup", up); ch.removeEventListener("pointercancel", up);
        card.classList.remove("hot");
        if (!ghost) { buzz(10); commit([...S.langs, l], l); return; }
        ghost.remove(); ch.style.opacity = "";
        if (ev.type === "pointerup" && over(ev)) {
          const st = slots.getBoundingClientRect().top;
          const idx = Math.max(0, Math.min(S.langs.length, Math.round((ev.clientY - st) / H)));

        }
      };
      ch.addEventListener("pointermove", move); ch.addEventListener("pointerup", up); ch.addEventListener("pointercancel", up);
    }));
  };
  draw();
}

  app.innerHTML = topbar() + `<h2>${t("games_t")}</h2><p class="sub">${t("games_s")}</p>
    <div class="seg">${kinds.map(([k, l]) => `<button type="button" class="pchip" data-k="${k}" aria-pressed="${poolKind === k}">${esc(l)}</button>`).join("")}</div>
    <div class="ggrid">${GAMES.map((g, k) => `<button type="button" class="gt" data-g="${g.id}" style="--c:${g.c};animation-delay:${k * 50}ms"><span class="gi">${svg(g.icon, 26)}</span><b>${t("g_" + g.id)}</b><small>${t("g_" + g.id + "_w")}</small></button>`).join("")}</div>`;
  bindTop();
  $$("[data-k]", app).forEach(b => b.onclick = () => { poolKind = b.dataset.k; buzz(6); vGames(); });
  $$("[data-g]", app).forEach(b => b.onclick = () => { backTo = "games"; buzz(8); gameById(b.dataset.g).run(poolItems()); });
}

function vWords() {
  const fs = [["", t("f_all")], ["new", t("f_new")], ["learn", t("f_learn")], ["ok", t("f_known")], ["solid", t("f_solid")]];
  let dopts = `<option value="">${t("all_days")}</option>`;
  for (let n = 1; n <= 14; n++) if (!TEST_DAYS[n]) dopts += `<option value="${n}" ${String(n) === wd ? "selected" : ""}>${t("day_n", { n })}</option>`;
  app.innerHTML = topbar() + `<h2>${t("words_t")}</h2><p class="sub">${t("words_s")}</p>
    <input class="search" id="q" type="search" placeholder="${esc(t("search"))}" value="${esc(wq)}" aria-label="${esc(t("search"))}">
    <div class="seg"><select class="daysel" id="fd" aria-label="${esc(t("all_days"))}">${dopts}</select>${fs.map(([k, l]) => `<button type="button" class="pchip" data-f="${k}" aria-pressed="${ws === k}">${l}</button>`).join("")}</div>
    <p class="count" id="cnt"></p><div id="wl"></div>`;
  bindTop();
  const list = () => {
    const q = norm(wq);
    const rows = ALL.filter(it => {
      if (wd && String(it.day) !== wd) return false;
      const c = S.cards[it.id];
      if (ws === "new" && c) return false;
      if (ws === "learn" && !(c && c.b <= 1)) return false;
      if (ws === "ok" && !(c && c.b >= 2 && c.b <= 3)) return false;
      if (ws === "solid" && !(c && c.b >= 4)) return false;
      return !q || [it.w, ...it.syns, ...Object.values(it.m), it.def].some(s => norm(s).includes(q));
    });
    $("#cnt").textContent = t("n_words", { n: rows.length });
    $("#wl").innerHTML = rows.map(it => `<div class="wrow" style="--c:${dayColor(it.day)}"><button type="button" class="wbtn" data-id="${it.id}" aria-expanded="${openRows.has(it.id)}"><span><b lang="en">${esc(it.w)}</b> <span class="ipa">/${esc(it.ipa)}/</span></span>${boxDots(it.id)}<span class="m">${S.langs.length ? S.langs.map(l => esc(it.m[l])).join(" · ") : esc(enDef(it))}</span></button>${sayBtn(it.w)}${openRows.has(it.id) ? `<div class="wdet">${it.def ? `<p class="defl">${lb("en")}<span lang="en">${esc(it.def)}</span></p>` : ""}<div class="syns"><b>≈</b>${it.syns.map(s => `<span class="syn" lang="en">${esc(s)}</span>`).join("")}</div><p class="exl" lang="en">${markEx(it)} ${sayBtn(it.ex, t("sentence"))}</p>${it.forms && it.forms.length > 1 ? `<p class="fam">${t("family")}: <span lang="en">${it.forms.map(esc).join(" · ")}</span></p>` : ""}<p class="fam">${t("pos_" + it.pos)} · ${t("day_n", { n: it.day })}</p></div>` : ""}</div>`).join("");
    $$("#wl .wbtn").forEach(b => b.onclick = () => { const id = b.dataset.id; openRows.has(id) ? openRows.delete(id) : openRows.add(id); list(); });
  };
  $("#q").oninput = e => { wq = e.target.value; list(); };
  $("#fd").onchange = e => { wd = e.target.value; list(); };
  $$("[data-f]", app).forEach(b => b.onclick = () => { ws = b.dataset.f; $$("[data-f]", app).forEach(x => x.setAttribute("aria-pressed", x === b)); list(); });
  list();
}

function vSet() {
  app.innerHTML = topbar() + `<h2>${t("set_t")}</h2>
    <p class="sh">${t("set_ui")}</p><div class="seg wrapit">${UIL.map(l => `<button type="button" class="pchip" data-ui="${l}" aria-pressed="${S.ui === l}" lang="${l}">${CODE[l]} · ${NATIVE[l]}</button>`).join("")}</div>
    <p class="sh">${t("set_combo")}</p><p class="sub">${t("ob_build_sub")}</p><div id="cb"></div>
    <p class="sh">${t("prog_t")}</p><p class="sub">${t("started", { d: fmtDate(S.start), n: calDay() })}</p><div id="rz"><button type="button" class="btn ghost wide" id="reset">${t("reset")}</button></div>
    <p class="sh">${t("how_t")}</p><ol class="how">${[1, 2, 3, 4, 5].map(k => `<li>${esc(t("how" + k))}</li>`).join("")}</ol>
    <p class="sync" id="sync">${t("sync_" + syncKey)}</p>`;
  bindTop();
  comboBuilder($("#cb"), () => { const lp = $("#lp"); if (lp) lp.textContent = `${CODE[S.ui]} · ${comboTxt()}`; });
  $$("[data-ui]", app).forEach(b => b.onclick = () => { S.ui = b.dataset.ui; persist(); buzz(10); render(); burstAt($(`[data-ui="${S.ui}"]`), 14); });
  $("#reset").onclick = () => {
    $("#rz").innerHTML = `<p class="sub">${t("reset_q")}</p><div class="onb-acts" style="margin-top:0"><button type="button" class="btn ghost" id="no">${t("cancel")}</button><button type="button" class="btn c" style="--c:var(--bad)" id="yes">${t("reset_y")}</button></div>`;
    $("#no").onclick = vSet;
    $("#yes").onclick = () => { const keep = { ui: S.ui, name: S.name, onb: true, lset: S.lset, langs: S.langs }; S = Object.assign(fresh(), keep); selDay = null; persist(); view = "today"; backTo = "today"; render(); };
  };
}

/* ---------- profile + leaderboard ---------- */
function vMe() {
  const lv = lvlOf(S.xp), st = streak(), nb = Object.keys(S.badges).length;
  const stats = [[t("s_xp"), S.xp, "var(--sun)"], [t("s_streak"), st, "var(--coral)"], [t("s_seen"), `${seenN()}/${ALL.length}`, "var(--sky)"], [t("s_solid"), solidN(), "var(--mint)"]];
  app.innerHTML = topbar() + `<section class="pcard" style="--c:${hueOf(myName())}"><div class="row"><span class="bigav">${esc(initial(myName()))}</span><div style="min-width:0"><div class="pname">${esc(myName())}</div><div class="plvl">${t("lvl", { n: lv.L })} · ${S.xp} XP</div></div></div>
      <div class="xbar"><i style="width:${Math.round(lv.cur / lv.need * 100)}%"></i></div><small>${t("next_lvl", { a: lv.cur, b: lv.need })}</small>
      <div id="nmw"><button type="button" class="pedit" id="ed">✎ ${t("edit_name")}</button></div></section>
    <div class="stats">${stats.map(([l, v, c], k) => `<div class="stat" style="--c:${c};animation-delay:${k * 60}ms"><b>${v}</b><small>${l}</small></div>`).join("")}</div>
    <p class="sh">${t("board_t")}</p><p class="sub" style="margin-bottom:10px">${t("board_s")}</p><div id="board"></div>
    <p class="sh">${t("badges_t")} · ${nb}/${BADGES.length}</p>
    <div class="badges">${BADGES.map((b, k) => { const on = !!S.badges[b.id]; return `<div class="bdg ${on ? "" : "off"}" style="--c:${b.c};animation-delay:${k * 40}ms"><span class="bi2">${svg(on ? b.i : "lock", 22, 2.3)}</span><b>${t("bd_" + b.id)}</b><small>${t("bd_" + b.id + "_d")}</small></div>`; }).join("")}</div>
    <button type="button" class="btn ghost wide" id="gs" style="margin-top:22px">${svg("gear", 20)} ${t("nav_set")}</button>`;
  bindTop();
  $("#gs").onclick = () => { view = "set"; backTo = "set"; render(); window.scrollTo(0, 0); };
  $("#ed").onclick = () => {
    $("#nmw").innerHTML = `<div class="namebox"><input id="nin2" maxlength="24" value="${esc(S.name)}" aria-label="${esc(t("name_ph"))}" autocomplete="nickname"><button type="button" class="btn" id="sv">${t("save")}</button></div>`;
    const ni = $("#nin2"); ni.focus(); ni.select();
    const save = () => { const v = cleanName(ni.value); if (v) { S.name = v; lastBoard = ""; persist(); buzz(10); } vMe(); };
    $("#sv").onclick = save;
    ni.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); save(); } };
  };
  drawBoard();
}
function drawBoard() {
  const el = $("#board"); if (!el) return;
  const me = BE && BE.me;
  const rows = (BOARD || []).filter(r => r && typeof r.name === "string")
    .map(r => ({ id: r.id, name: cleanName(r.name) || t("anon"), xp: Math.max(0, +r.xp || 0), day: +r.day || 1, seen: +r.seen || 0, streak: +r.streak || 0 }));
  const mine = { id: me || "__me", name: myName(), xp: S.xp, day: curDay(), seen: seenN(), streak: streak() };
  const at = rows.findIndex(r => r.id === mine.id);
  if (at >= 0) rows[at] = mine; else if (S.name && me && !boardRO) rows.push(mine);
  rows.sort((a, b) => b.xp - a.xp);
  let html = "";
  if (!BE && boardState !== "ok") html += `<p class="onote">${t("board_off")}</p>`;
  if (boardRO) html += `<p class="onote">${t("board_ro")}</p>`;
  if (!rows.length && BE) html += `<p class="onote">${t("board_empty")}</p>`;
  const you = r => r.id === mine.id ? ` · ${t("board_you")}` : "";
  if (rows.length >= 3) {
    const P = [[1, 64, "var(--sky)"], [0, 92, "var(--sun)"], [2, 46, "var(--coral)"]];
    html += `<div class="podium">${P.map(([i, h, c], k) => { const r = rows[i]; return `<div class="pod" style="animation-delay:${k * 90}ms"><span class="av" style="--c:${hueOf(r.name)}">${esc(initial(r.name))}</span><b>${esc(r.name)}${you(r)}</b><small>${r.xp} XP</small><div class="blk" style="--c:${c};height:${h}px">${i + 1}</div></div>`; }).join("")}</div>`;
  }
  const from = rows.length >= 3 ? 3 : 0;
  html += rows.slice(from, 50).map((r, j) => `<div class="lrow ${r.id === mine.id ? "me" : ""}" style="animation-delay:${Math.min(j, 10) * 40}ms"><span class="n">${from + j + 1}</span><span class="av" style="--c:${hueOf(r.name)}">${esc(initial(r.name))}</span><span style="min-width:0"><b>${esc(r.name)}${you(r)}</b><small>${t("b_row", { d: r.day, w: r.seen })}${r.streak ? ` · 🔥 ${r.streak}` : ""}</small></span><span class="x">${r.xp} XP</span></div>`).join("");
  const myRank = rows.findIndex(r => r.id === mine.id);
  if (myRank >= 50) html += `<div class="lrow me"><span class="n">${myRank + 1}</span><span class="av" style="--c:${hueOf(mine.name)}">${esc(initial(mine.name))}</span><span style="min-width:0"><b>${esc(mine.name)}${you(mine)}</b><small>${t("b_row", { d: mine.day, w: mine.seen })}</small></span><span class="x">${mine.xp} XP</span></div>`;
  if (el._h === html) return;
  el._h = html; el.innerHTML = html;
}

/* ---------- keys + boot ---------- */
document.addEventListener("keydown", e => {
  if (!keyHandler || e.ctrlKey || e.metaKey || e.altKey) return;
  const tg = e.target;
  if (tg && tg.matches && tg.matches("input,textarea,select")) return;
  if (tg && tg.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
  keyHandler(e);
});
$$(".bnav .bi").forEach(b => { b.dataset.i = b.dataset.i; });
function boot() { S = normalize(loadLocal()); render(); connect(); }
fetch("words.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { ALL = [...d.words, ...d.phrases]; ALL.forEach(x => BYID[x.id] = x); boot(); })
  .catch(() => { app.innerHTML = `<p class="err" style="padding-top:40px">${esc(T.en.load_err)} · ${esc(T.az.load_err)}</p>`; });
})();
</script>
